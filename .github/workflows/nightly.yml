name: Nightly fuzz
on:
  schedule: [{ cron: '17 19 * * *' }]
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hexhaven/bot run sim -- --games 5000
      - run: pnpm vitest run --project engine src/engine.fuzz.test.ts
        env: { FUZZ_RUNS: '1000', FUZZ_STEPS: '1500' }
